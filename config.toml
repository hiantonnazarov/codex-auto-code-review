# Конфигурация Codex Auto Code Review для ЭТОГО репозитория.
#
# Где применяются настройки:
#   1. Встроенные значения по умолчанию в Python.
#   2. Глобальный файл ~/.codex-auto-code-review/config.toml.
#   3. Устаревший локальный .codex-auto-review.toml (для совместимости).
#   4. Этот файл config.toml в корне Git-репозитория — наивысший приоритет.
#
# Для настройки всех проектов скопируйте файл в глобальное расположение.
# В другом проекте разместите собственный config.toml с разделом [review].
# Если config.toml другого проекта НЕ содержит [review], он игнорируется.
# Строковые имена опций и допустимые значения сохраняются на английском:
# это контракт Python-кода, а не текст интерфейса.

[review]

# Включать ли автоматическое ревью.
# true = включено; false = выключено (не создаются новые проверки).
enabled = true

# Правило отбора изменений:
# "significant" = изменения кода: минимум строк ИЛИ минимум файлов;
# "all" = любые изменения подходящих файлов независимо от количества строк.
mode = "significant"

# Нижний порог суммарного количества строк +/- в успешных операциях apply_patch.
# Целое число >= 0; применяется только в режиме "significant".
# По умолчанию при 30 и более изменённых строках запускается ревью.
min_changed_lines = 30

# Минимальное количество изменённых файлов кода.
# Целое число >= 1; применяется только в режиме "significant".
# По умолчанию два файла запускают ревью независимо от числа строк.
min_changed_files = 2

# Маски исключений из проверки (единственные правила выбора путей).
# Массив строк-масок; [] = ничего дополнительно не исключать.
# Обычно исключаются зависимости, сборки, окружения и минифицированные файлы.
exclude_globs = [
  "**/node_modules/**",
  "**/vendor/**",
  "**/dist/**",
  "**/build/**",
  "**/.venv/**",
  "**/coverage/**",
  "**/*.min.js",
  "**/*.lock",
]

# Идентификатор модели независимого Codex reviewer.
# "" = модель из настроек Codex CLI; иначе укажите поддерживаемое имя модели,
# например "gpt-6", если этот идентификатор доступен в вашем Codex.
reviewer_model = ""

# Уровень рассуждений reviewer:
# "low" = быстрее и дешевле; "medium" = компромисс;
# "high" = более глубокая проверка; "xhigh" = максимальная глубина.
# Фактическая поддержка зависит от выбранной модели.
reasoning_effort = "high"

# Команда запуска Codex CLI.
# "codex" = искать в PATH; можно указать полный путь к исполняемому файлу.
codex_command = "codex"

# Минимальная заявленная моделью уверенность для блокирующего замечания.
# Число от 0.0 до 1.0 включительно; 0.65 = учитывать замечания с >= 65%.
# Это модельная оценка, а НЕ статистически подтверждённая вероятность.
confidence_threshold = 0.65

# Приоритеты, способные блокировать завершение хода.
# Массив значений "P0", "P1", "P2", "P3"; [] = никогда не блокировать по замечаниям.
# P0 = критическая ошибка; P1 = серьёзная; P2 = существенная; P3 = мелкая.
blocking_priorities = ["P0", "P1", "P2"]

# Максимум раундов ревью на один пользовательский ход.
# Целое число >= 1; по достижении лимита дальнейшие проверки не запускаются.
# Нерешённые ошибки сохраняются в отчёте и НЕ считаются пройденным ревью.
max_review_rounds = 3

# Максимальная длина исходного пользовательского запроса для передачи в reviewer.
# Целое число >= 1000; 50000 = не обрезать задачу, а явно сообщить об ошибке
# при превышении лимита. При необходимости увеличьте для больших спецификаций.
max_task_chars = 50000

# Максимальное число символов патчей apply_patch в одном фрагменте ревью.
# Целое число >= 1000; крупные изменения разбиваются на части без обрезки.
max_diff_chars_per_chunk = 26000

# Максимально допустимое количество фрагментов diff за одно ревью.
# Целое число >= 1; превышение вызывает явную ошибку, а не ложный успех.
# При нескольких фрагментах дополнительно выполняется один интеграционный проход.
# Он использует тот же timeout_seconds_per_chunk, но не включается в max_chunks.
max_chunks = 6

# Максимальное время одного вызова Codex reviewer в секундах.
# Целое число >= 1; при превышении возникает ошибка ревью.
timeout_seconds_per_chunk = 100

# Действие при технической ошибке ревьюера (не при найденных ошибках кода).
# true = разрешить завершение хода с предупреждением об ошибке проверки;
# false = блокировать завершение, пока не устранена ошибка или не вмешался пользователь.
# Ни один вариант НЕ превращает неудачную проверку в "passed".
fail_open = true

# Каталог JSON-отчётов.
# "" = каталог состояния вне репозитория ~/.codex-auto-code-review/state/reports/;
# абсолютный путь = указанная папка;
# относительный путь = папка относительно корня проверяемого Git-репозитория.
report_dir = ""
